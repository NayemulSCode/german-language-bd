name: Keep Supabase awake
# Supabase pauses free projects after about a week without activity. This pings the API twice a week.
# Needs repository secrets SUPABASE_URL and SUPABASE_ANON_KEY; does nothing if they are not set.
on:
  schedule:
    - cron: '17 6 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Ping
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then echo "Secrets not set, skipping."; exit 0; fi
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" -H "apikey: $SUPABASE_ANON_KEY" "$SUPABASE_URL/auth/v1/health"
