name: Build audio
# Generates TTS clips for all lessons (Piper, German "Thorsten" voice, CC0) and commits public/audio.
# Run manually after adding or changing lessons. Existing clips are kept, so reruns are fast.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install piper-tts
      - name: Download voice
        run: |
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/medium
          curl -fsSL -O $base/de_DE-thorsten-medium.onnx
          curl -fsSL -O $base/de_DE-thorsten-medium.onnx.json
      - run: npm run audio
        env:
          PIPER_MODEL: de_DE-thorsten-medium.onnx
          PIPER_CMD: python3 -m piper
      - name: Commit clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio
          git diff --cached --quiet || (git commit -m "Update audio clips" && git push)
